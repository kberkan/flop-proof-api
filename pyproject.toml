[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flop-proof-sdk"
version = "0.3.0"
description = "Python SDK for the FLOP Proof API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "cryptography>=43,<48",
    "base58>=2.1,<3",
]

[tool.setuptools.packages.find]
include = ["flop_proof_sdk*"]

[tool.pytest.ini_options]
testpaths = [
    "test_verifier.py",
    "test_task_hash.py",
    "test_stark_batch_api.py",
    "test_api_contract.py",
    "test_client_errors.py",
    "test_client_signed.py",
    "test_lifecycle.py",
    "test_idempotency.py",
    "test_security_regression.py",
    "test_rate_limit_http.py",
    "test_event_replay.py",
    "test_persistent_replay.py",
    "test_processed_task_store.py",
    "test_validator_api.py",
    "test_validator_registry.py",
    "test_compute_channel.py",
    "test_rate_limit.py",
    "test_testpaths_guard.py",
    "test_wire_vectors_source.py",
    "test_sr25519_edge_cases.py",
    "test_authorization.py",
    "test_canonical_v3.py",
    "test_sdk_canonical_v3.py",
    "test_signature_input_validation.py",
    "test_validator_result_validation.py",
    "test_api_input_typing.py",
]
