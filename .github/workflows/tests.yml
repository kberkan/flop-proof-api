name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FLOP_API_KEY: flop-test-key-2026
      FLOP_RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize test database
        run: |
          python - <<'PYINIT'
          from app.database import Base, engine
          import app.models

          Base.metadata.create_all(bind=engine)
          print("Test database schema initialized.")
          PYINIT

      - name: Start API server
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/flop-uvicorn.log 2>&1 &
          API_PID=$!

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "API server is ready."
              break
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API server exited before becoming ready."
              echo "===== /tmp/flop-uvicorn.log ====="
              cat /tmp/flop-uvicorn.log
              exit 1
            fi

            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:8000/health > /dev/null; then
            echo "API server did not become ready within 30 seconds."
            echo "===== /tmp/flop-uvicorn.log ====="
            cat /tmp/flop-uvicorn.log
            exit 1
          fi

      - name: Run tests
        run: pytest -q

      - name: Check embedded wire vectors against pinned upstream corpus
        run: python scripts/check_wire_vectors.py

      - name: Show API server log
        if: always()
        run: |
          echo "===== /tmp/flop-uvicorn.log ====="
          cat /tmp/flop-uvicorn.log || true

  dashboard:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Tests import .ts modules directly; Node strips the types without a
          # flag from 22.18.0 / 23.6.0. Matches the local development version.
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit
