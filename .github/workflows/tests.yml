name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FLOP_API_KEY: flop-test-key-2026
      FLOP_RATE_LIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests against a temporary database
        # scripts/run_tests.sh creates a temporary database, starts the API
        # server on 127.0.0.1:8000 with FLOP_DATABASE_URL pointing at it, runs
        # pytest with the same environment and stops the server afterwards.
        env:
          FLOP_TEST_LOG_DIR: /tmp/flop-test-logs
        run: bash scripts/run_tests.sh -q

      - name: Check embedded wire vectors against pinned upstream corpus
        run: python scripts/check_wire_vectors.py

      - name: Show API server log
        if: always()
        run: |
          echo "===== /tmp/flop-test-logs/flop-uvicorn.log ====="
          cat /tmp/flop-test-logs/flop-uvicorn.log || true

  dashboard:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Tests import .ts modules directly; Node strips the types without a
          # flag from 22.18.0 / 23.6.0. Matches the local development version.
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        # Pages fetch data in the browser and the API proxy runs per request,
        # so the build needs neither a running API nor FLOP_API_KEY.
        run: npm run build
